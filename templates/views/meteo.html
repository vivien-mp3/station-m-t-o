{{define "meteo"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Météo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>METEOOOOO</h1>
    
    <h2>{{.Nom}}</h2>

    <ul class="grid">
    {{range $index, $value := .Daily.Time}}
        <li class="card">

            <p>{{$index}} : {{$value.TempMax}}</p>
        </li>
    {{end}}
    </ul>
</body>
</html>
{{end}}
